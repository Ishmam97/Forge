#:schema https://developers.openai.com/codex/config-schema.json

# Project-scoped Codex config for the agentic_swe scaffold.
# Codex loads project .codex/ layers only after the repository is trusted.

[features]
multi_agent = true
hooks = true

[agents]
max_threads = 6
max_depth = 1

[mcp_servers.obsidian]
command = "node"
args = ["vendor/mcpvault/dist/server.js", "memory"]
cwd = "."  # paths are relative to repo root; omitting cwd or setting ".." breaks resolution
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.obsidian.tools.read_multiple_notes]
approval_mode = "approve"

[mcp_servers.obsidian.tools.search_notes]
approval_mode = "approve"

[mcp_servers.obsidian.tools.read_note]
approval_mode = "approve"

[mcp_servers.obsidian.tools.patch_note]
approval_mode = "approve"

[mcp_servers.obsidian.tools.update_frontmatter]
approval_mode = "approve"

